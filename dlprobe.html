<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>dl probe</title></head>
<body><pre id="out">PENDING</pre>
<script>
const out=document.getElementById('out');
const log=s=>{ out.textContent += "\n"+s; };
out.textContent="START";
(async()=>{
  try{
    const r=await fetch('https://api.hk0.cc/api/douyin?url='+encodeURIComponent('https://www.douyin.com/video/7675412388233414629'),{mode:'cors',credentials:'omit'});
    const j=await r.json();
    const url=j.data.url;
    log('parsed url='+url.slice(0,60));
    const r2=await fetch(url,{mode:'cors',credentials:'omit',headers:{'Range':'bytes=0-262143'}});
    log('video http='+r2.status+' ct='+r2.headers.get('content-type')+' cr='+r2.headers.get('content-range')+' len='+r2.headers.get('content-length'));
    const reader=r2.body.getReader();
    let got=0;
    while(true){ const d=await reader.read(); if(d.done) break; got+=d.value.length; if(got>200000) break; }
    log('STREAM_READ_BYTES='+got);
    log('VERDICT='+(got>100000?'DOWNLOADABLE':'FAIL'));
  }catch(e){ log('FAIL '+e.name+': '+e.message); }
  out.textContent += "\nDONE";
})();
</script></body></html>
