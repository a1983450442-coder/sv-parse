<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>dl probe 4</title></head>
<body><pre id="out">PENDING</pre>
<script>
const out=document.getElementById('out');
const log=s=>{ out.textContent += "\n"+s; };
out.textContent="START origin="+location.origin;
async function tryFetch(tag,url,init){
  try{
    const r=await fetch(url,init);
    let extra='';
    if(r.ok){ try{ const reader=r.body.getReader(); let got=0;
      while(true){ const d=await reader.read(); if(d.done) break; got+=d.value.length; if(got>150000) break; }
      extra=' BYTES='+got;
    }catch(e){ extra=' stream_err='+e.message; } }
    log(tag+' http='+r.status+' ct='+(r.headers.get('content-type')||'-')+' len='+(r.headers.get('content-length')||'-')+extra);
  }catch(e){ log(tag+' THROW '+e.name+': '+e.message); }
}
(async()=>{
  let main='';
  try{
    const r=await fetch('https://api.hk0.cc/api/douyin?url='+encodeURIComponent('https://www.douyin.com/video/7675412388233414629'),{mode:'cors',credentials:'omit'});
    const j=await r.json(); main=j.data.url;
  }catch(e){ log('parse fail '+e.message); out.textContent+="\nDONE"; return; }
  await tryFetch('X0-default-referrer', main, {mode:'cors',credentials:'omit'});
  await tryFetch('X1-no-referrer', main, {mode:'cors',credentials:'omit',referrerPolicy:'no-referrer'});
  await tryFetch('X2-no-referrer-range', main, {mode:'cors',credentials:'omit',referrerPolicy:'no-referrer',headers:{'Range':'bytes=0-262143'}});
  out.textContent += "\nDONE";
})();
</script></body></html>
