<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>e2e</title></head>
<body><pre id="r">PENDING</pre>
<script>
const r=document.getElementById('r');
const L=s=>{ r.textContent += "\n"+s; };
const sleep=ms=>new Promise(z=>setTimeout(z,ms));
r.textContent="E2E_START";
(async()=>{
  try{
    const f=document.createElement('iframe');
    f.style.cssText='width:420px;height:900px;border:0';
    f.src='index.html';
    document.body.appendChild(f);
    await new Promise(z=>{ f.onload=z; setTimeout(z,15000); });
    const w=f.contentWindow, d=f.contentDocument;
    L('1_IFRAME_LOADED origin='+w.location.origin+' hasExtract='+(typeof w.extractUrls));
    await sleep(2500);

    // patch anchor click to record
    w.__clicks=[];
    const origClick = w.HTMLAnchorElement.prototype.click;
    w.HTMLAnchorElement.prototype.click = function(){
      if(this.download){ w.__clicks.push({name:this.download, href:String(this.href).slice(0,40)}); }
      return origClick.apply(this, arguments);
    };

    const ta=d.getElementById('urls');
    const inp=d.querySelector('input[type=file]');
    L('2_DOM ta='+(!!ta)+' fileInput='+(!!inp)+' e2eHook='+(typeof w.__E2E));
    const link='https://www.douyin.com/video/7675412388233414629';
    if(ta){ ta.value=link; ta.dispatchEvent(new w.Event('input',{bubbles:true})); }
    if(inp){
      const dt=new DataTransfer();
      dt.items.add(new File([link+String.fromCharCode(10)],'links.txt',{type:'text/plain'}));
      inp.files=dt.files;
      inp.dispatchEvent(new w.Event('change',{bubbles:true}));
      L('3_FILE_INJECTED n='+inp.files.length);
    } else { L('3_NO_FILE_INPUT'); }
    await sleep(400);

    const go=d.getElementById('go');
    L('4_BTN go='+(!!go)+' disabled='+(go?go.disabled:'-'));
    if(go) go.click();

    let cards=0;
    for(let i=0;i<40;i++){
      await sleep(1500);
      const cs=d.querySelectorAll('#out .card, #out > div');
      cards=cs.length;
      const logtxt=(d.getElementById('log')||{}).textContent||'';
      if(i%5===0) L('   t='+(i*1.5)+'s cards='+cards+' logTail='+logtxt.replace(/\s+/g,' ').slice(-90));
      if(cards>0 && /下载视频/.test(d.body.innerText)) break;
    }
    L('5_RESULT cards='+cards+' hasDownloadBtn='+/下载视频/.test(d.body.innerText));

    const btn=[].slice.call(d.querySelectorAll('button')).find(b=>/^下载视频/.test(b.textContent));
    if(btn){
      btn.click();
      L('6_DOWNLOAD_CLICKED');
      for(let i=0;i<25;i++){
        await sleep(1200);
        if(w.__clicks.length) break;
      }
      L('7_ANCHOR_CLICKS='+JSON.stringify(w.__clicks));
    } else {
      L('6_NO_DOWNLOAD_BUTTON');
    }
    const tail=((d.getElementById('log')||{}).textContent||'').replace(/\s+/g,' ');
    L('8_LOG_TAIL='+tail.slice(-260));
    L('VERDICT='+(w.__clicks.length>0?'PASS':'FAIL'));
  }catch(e){ L('E2E_THROW '+e.name+': '+e.message); }
  r.textContent += "\nE2E_DONE";
})();
</script></body></html>
