<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>e2e2</title></head>
<body><pre id="r">PENDING</pre>
<script>
const r=document.getElementById('r');
const L=s=>{ r.textContent += "\n"+s; };
const sleep=ms=>new Promise(z=>setTimeout(z,ms));
r.textContent="E2E_START";
(async()=>{
  try{
    const f=document.createElement('iframe');
    f.style.cssText='width:420px;height:900px;border:0';
    f.src='index.html';
    document.body.appendChild(f);
    await new Promise(z=>{ f.onload=z; setTimeout(z,15000); });
    const w=f.contentWindow, d=f.contentDocument;
    L('1_LOADED pb='+w.location.origin);
    await sleep(3000);
    w.__clicks=[];
    const P=w.HTMLAnchorElement.prototype, orig=P.click;
    P.click=function(){ if(this.download) w.__clicks.push({n:this.download,href:String(this.href).slice(0,32)}); return orig.apply(this,arguments); };
    const ta=d.getElementById('urls');
    ta.value='https://www.douyin.com/video/7675412388233414629';
    ta.dispatchEvent(new w.Event('input',{bubbles:true}));
    d.getElementById('go').click();
    const getLog=()=>((d.getElementById('log')||{}).textContent||'').replace(/\s+/g,' ');
    for(let i=0;i<30;i++){ await sleep(1500); if(/下载视频/.test(d.body.innerText)) break; }
    L('2_CARD_READY hasBtn='+/下载视频/.test(d.body.innerText));
    const btn=[].slice.call(d.querySelectorAll('button')).find(b=>/^下载视频/.test(b.textContent));
    if(!btn){ L('VERDICT=FAIL_NO_BTN'); r.textContent+="\nE2E_DONE"; return; }
    btn.click();
    L('3_CLICKED');
    let done=false;
    for(let i=0;i<90;i++){
      await sleep(1500);
      const t=getLog();
      if(/下载完成/.test(t)){ done=true; L('4_DONE_AT='+((i+1)*1.5)+'s'); break; }
      if(/浏览器直下失败/.test(t)){ done=true; L('4_DOWNLOAD_FAILED_AT='+((i+1)*1.5)+'s'); break; }
      if(i%10===9) L('   t='+((i+1)*1.5)+'s tail='+t.slice(-110));
    }
    L('5_ANCHOR_CLICKS='+JSON.stringify(w.__clicks));
    L('6_LOG_TAIL='+getLog().slice(-300));
    L('VERDICT='+(done&&/下载完成/.test(getLog())?'PASS':'UNKNOWN'));
  }catch(e){ L('E2E_THROW '+e.name+': '+e.message); }
  r.textContent += "\nE2E_DONE";
})();
</script></body></html>
