<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>e2e live</title></head>
<body style="margin:0">
<iframe id="fr" src="index.html" style="width:420px;height:900px;border:0"></iframe>
<pre id="r" style="display:none"></pre>
<script>
var E={step:'boot',done:false,clicks:[],log:'',size:0};
window.__E2E=E;
var sleep=function(ms){return new Promise(function(z){setTimeout(z,ms)})};
window.addEventListener('load',function(){
  E.step='loaded';
  (async function(){
    try{
      var f=document.getElementById('fr');
      await sleep(3000);
      var w=f.contentWindow, d=f.contentDocument;
      E.step='frame_ready';
      E.clicks=[];
      var P=w.HTMLAnchorElement.prototype, orig=P.click;
      P.click=function(){ if(this.download){ E.clicks.push({n:this.download,href:String(this.href).slice(0,40)}); } return orig.apply(this,arguments); };
      var ta=d.getElementById('urls');
      ta.value='https://www.douyin.com/video/7675412388233414629';
      ta.dispatchEvent(new w.Event('input',{bubbles:true}));
      d.getElementById('go').click();
      E.step='parsing';
      var getLog=function(){ return String(((d.getElementById('log')||{}).textContent)||'').replace(/\s+/g,' '); };
      for(var i=0;i<40;i++){ await sleep(1500); E.log=getLog(); if(/下载视频/.test(d.body.innerText)) break; }
      E.step='card_ready';
      var btn=[].slice.call(d.querySelectorAll('button')).filter(function(b){return /^下载视频/.test(b.textContent)})[0];
      if(!btn){ E.step='no_button'; E.done=true; return; }
      btn.click();
      E.step='downloading';
      for(var k=0;k<240;k++){
        await sleep(1000);
        E.log=getLog();
        if(/下载完成/.test(E.log)){ E.step='saved'; E.done=true; return; }
        if(/浏览器直下失败/.test(E.log)){ E.step='download_failed'; E.done=true; return; }
      }
      E.step='timeout'; E.done=true;
    }catch(e){ E.step='throw:'+e.name+':'+e.message; E.done=true; }
  })();
});
</script></body></html>
