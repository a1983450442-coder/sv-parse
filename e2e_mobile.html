<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>m-e2e</title></head>
<body style="margin:0">
<iframe id="fr" src="index.html" style="width:100%;height:800px;border:0"></iframe>
<pre id="r" style="display:none"></pre>
<script>
var E={step:'boot',done:false,clicks:[],log:'',meta:{}};
window.__E2E=E;
var sleep=function(ms){return new Promise(function(z){setTimeout(z,ms)})};
window.addEventListener('load',function(){
  (async function(){
    try{
      var f=document.getElementById('fr');
      await sleep(3000);
      var w=f.contentWindow, d=f.contentDocument;
      E.meta.ua=navigator.userAgent;
      E.meta.vw=w.innerWidth;
      E.meta.scrollW=d.documentElement.scrollWidth;
      E.meta.overflow=(d.documentElement.scrollWidth>w.innerWidth+2);
      E.meta.btnCount=d.querySelectorAll('button').length;
      var ta0=d.getElementById('urls');
      E.meta.taVisible=!!(ta0 && ta0.offsetWidth>0);
      E.step='meta_done';
      E.clicks=[];
      var P=w.HTMLAnchorElement.prototype, orig=P.click;
      P.click=function(){ if(this.download){ E.clicks.push(String(this.download).slice(0,40)); } return orig.apply(this,arguments); };
      var ta=d.getElementById('urls');
      ta.value='https://www.bilibili.com/video/BV1xx411c7mD/';
      ta.dispatchEvent(new w.Event('input',{bubbles:true}));
      d.getElementById('go').click();
      E.step='parsing_bili';
      var getLog=function(){ return String(((d.getElementById('log')||{}).textContent)||'').replace(/\s+/g,' '); };
      for(var i=0;i<40;i++){ await sleep(1500); E.log=getLog(); if(/下载视频/.test(d.body.innerText)) break; }
      var btn=[].slice.call(d.querySelectorAll('button')).filter(function(b){return /^下载视频/.test(b.textContent)})[0];
      if(!btn){ E.step='no_button'; E.done=true; return; }
      btn.click();
      E.step='downloading_bili';
      for(var k=0;k<180;k++){
        await sleep(1000);
        E.log=getLog();
        if(/下载完成/.test(E.log)){ E.step='saved'; E.done=true; return; }
        if(/浏览器直下失败/.test(E.log)){ E.step='download_failed'; E.done=true; return; }
      }
      E.step='timeout'; E.done=true;
    }catch(e){ E.step='throw:'+e.name+':'+e.message; E.done=true; }
  })();
});
</script></body></html>
