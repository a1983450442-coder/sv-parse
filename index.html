<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<meta name="referrer" content="no-referrer">
<title>短视频解析下载 · 无水印</title>
<meta name="description" content="粘贴抖音、快手、B站、小红书、视频号分享链接，一键解析无水印视频与图集。">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0f19; --bg2:#121829; --card:#161d31; --card2:#1c2440;
  --line:#28304d; --txt:#e8ecf7; --sub:#8a94b3; --acc:#4f7cff; --acc2:#7b5cff;
  --ok:#2ecc8f; --warn:#ffb020; --err:#ff5c6c;
}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 15% -10%,#1b2750 0%,transparent 55%),
             radial-gradient(900px 500px at 100% 0%,#2a1c4d 0%,transparent 50%),
             var(--bg);
  color:var(--txt);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh; padding:0 0 64px;
}
.wrap{max-width:860px;margin:0 auto;padding:22px 16px 0}
header{text-align:center;padding:14px 0 22px}
h1{margin:0;font-size:26px;letter-spacing:.5px;
   background:linear-gradient(92deg,#7ba4ff,#a78bfa 55%,#f472b6);
   -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.sub{color:var(--sub);font-size:13px;margin-top:8px}
.sub b{color:#9db4ff;font-weight:600}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
      border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 8px 30px rgba(0,0,0,.28)}
textarea{width:100%;min-height:104px;resize:vertical;background:#0e1424;color:var(--txt);
  border:1px solid var(--line);border-radius:12px;padding:12px 13px;font:14px/1.6 inherit;outline:none}
textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,124,255,.16)}
.row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
button{border:0;border-radius:11px;padding:11px 18px;font:600 14px/1 inherit;color:#fff;
  background:linear-gradient(92deg,var(--acc),var(--acc2));cursor:pointer;transition:.18s;
  box-shadow:0 4px 16px rgba(79,124,255,.28)}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}
button:active{transform:translateY(0)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}
button.ghost{background:#1b2440;box-shadow:none;border:1px solid var(--line);color:#c3cbe6}
button.ghost:hover{background:#212c4d}
button.sm{padding:8px 13px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);
  background:#141b2e;border:1px solid var(--line);border-radius:999px;padding:5px 11px;margin:4px 6px 0 0}
.pill.on{color:#9db4ff;border-color:#3a4b86;background:#18203a}
.tip{font-size:12.5px;color:var(--sub);margin-top:10px;line-height:1.7}
.tip code{background:#0e1424;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:#9db4ff;font-size:12px}
.log{margin-top:12px;font:12.5px/1.75 ui-monospace,Menlo,Consolas,monospace;
  background:#0a0f1c;border:1px solid var(--line);border-radius:10px;padding:11px 12px;
  max-height:190px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:#9aa6c8}
.log .e{color:var(--err)} .log .ok{color:var(--ok)} .log .w{color:var(--warn)}
.res{display:flex;gap:14px;flex-wrap:wrap}
.thumb{width:132px;flex:0 0 auto;border-radius:12px;overflow:hidden;background:#0e1424;
  border:1px solid var(--line);aspect-ratio:3/4;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.meta{flex:1;min-width:220px}
.meta h3{margin:0 0 8px;font-size:16px;line-height:1.45;font-weight:700}
.kv{font-size:13px;color:var(--sub);margin:3px 0}
.kv b{color:#c3cbe6;font-weight:600}
.quals{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qual{border:1px solid var(--line);background:#141b2e;border-radius:9px;padding:7px 12px;
  font-size:12.5px;color:#c3cbe6;cursor:pointer;transition:.15s}
.qual:hover{border-color:#3a4b86}
.qual.on{border-color:var(--acc);background:#18203a;color:#9db4ff;box-shadow:0 0 0 3px rgba(79,124,255,.14)}
.bar{height:7px;background:#0e1424;border:1px solid var(--line);border-radius:99px;
  overflow:hidden;margin-top:10px;display:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));
  border-radius:99px;transition:width .16s}
.acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:12px}
.grid figure{margin:0;border-radius:10px;overflow:hidden;border:1px solid var(--line);
  background:#0e1424;position:relative}
.grid img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover}
.grid a{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:8px;color:#fff;text-decoration:none;font-size:12px;font-weight:600;
  background:linear-gradient(transparent 55%,rgba(0,0,0,.72))}
.status{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.dot.g{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.r{background:var(--err);box-shadow:0 0 8px var(--err)}
.dot.y{background:var(--warn);box-shadow:0 0 8px var(--warn)}
footer{text-align:center;color:#5c6685;font-size:12px;margin-top:28px;line-height:1.9}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;
  background:#1d2540;border:1px solid #36406a;color:#dfe5f7;padding:11px 18px;border-radius:11px;
  font-size:13.5px;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:540px){
  .wrap{padding:14px 12px 0}
  h1{font-size:22px}
  .thumb{width:104px}
  .card{padding:14px;border-radius:14px}
  button{padding:11px 15px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>短视频解析下载</h1>
  <div class="sub">粘贴分享链接 → <b>无水印</b> 视频 / 图集 · 电脑手机都能用 · 无需安装</div>
</header>

<div class="status" id="status">
  <span class="pill" id="pApi"><span class="dot y"></span>解析服务检测中…</span>
  <span class="pill on">纯网页 · 零安装</span>
  <span class="pill on">支持抖音 / 快手 / B站 / 视频号</span>
</div>

<div class="card">
  <textarea id="urls" placeholder="把抖音/快手/B站的分享文案或链接整段粘进来，例如：
7.88 复制打开抖音，看看【小卷有话说】的作品 https://v.douyin.com/xxxxxx/

支持一次粘多条，每行一条。"></textarea>
  <div class="row">
    <button id="go">开始解析</button>
    <button class="ghost" id="clr">清空</button>
    <button class="ghost" id="paste">粘贴</button>
  </div>
  <div class="tip">
    支持 <code>douyin.com</code> <code>v.douyin.com</code> <code>iesdouyin.com</code>
    <code>kuaishou.com</code> <code>bilibili.com</code> <code>b23.tv</code>
    <code>xiaohongshu.com</code> <code>weixin.qq.com/sph</code> 等；其它平台自动走聚合解析。
  </div>
  <div class="log" id="log">就绪。粘贴链接后点「开始解析」。</div>
</div>

<div id="out"></div>

<footer>
  解析结果来自第三方公开接口，仅供个人学习与备份使用。<br>
  请勿用于商业用途；下载内容的版权归原作者所有。
</footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var API = 'https://api.hk0.cc/api/';
  var $ = function(id){ return document.getElementById(id); };

  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(t._tm);
    t._tm = setTimeout(function(){ t.classList.remove('on'); }, 2200);
  }

  function logLine(s, cls){
    var el = $('log');
    var d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = s;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
  }
  function logReset(){ $('log').textContent = ''; }

  // 从任意分享文案里抽出所有链接
  function extractUrls(text){
    var re = /https?:\/\/[^\s，,。、！!？?；;：:【】\[\]<>"'）)】]+/g;
    var m = text.match(re) || [];
    var seen = {}, out = [];
    for (var i = 0; i < m.length; i++){
      var u = m[i].replace(/[.,;:!?，。；：！？、)）】]+$/, '');
      if (!seen[u]) { seen[u] = 1; out.push(u); }
    }
    return out;
  }

  var PLATFORMS = [
    ['douyin',      /(?:douyin\.com|iesdouyin\.com)/i],
    ['bilibili',    /(?:bilibili\.com|b23\.tv|acg\.tv)/i],
    ['ksjx',        /(?:kuaishou\.com|kwai\.com|chenzhongtech\.com)/i],
    ['xhs',         /(?:xiaohongshu\.com|xhslink\.com)/i],
    ['wxsph',       /weixin\.qq\.com\/sph|channels\.weixin\.qq\.com/i],
    ['ppxia',       /(?:pipix\.com|pearvideo\.com)/i],
    ['toutiao',     /(?:toutiao\.com|ixigua\.com)/i],
    ['qiyi',        /iqiyi\.com/i],
    ['zuiyou',      /izuiyou\.com/i]
  ];

  function pickPlatform(url){
    for (var i = 0; i < PLATFORMS.length; i++){
      if (PLATFORMS[i][1].test(url)) return PLATFORMS[i][0];
    }
    return 'juhev'; // 聚合解析兜底
  }

  function apiFor(platform){
    if (platform === 'xhs') return API + 'xhs?url=';
    if (platform === 'ksjx') return API + 'ksjx?url=';
    if (platform === 'wxsph') return API + 'wxsph?url=';
    if (platform === 'juhev') return API + 'juhev?url=';
    return API + platform + '?url=';
  }

  // 探测解析服务可用性
  function checkApi(){
    var ctl = new AbortController();
    var tm = setTimeout(function(){ ctl.abort(); }, 9000);
    fetch(API + 'douyin?url=' + encodeURIComponent('https://www.douyin.com/video/7675412388233414629'),
          { signal: ctl.signal })
      .then(function(r){ return r.json(); })
      .then(function(j){
        clearTimeout(tm);
        var p = $('pApi');
        if (j && j.code === 200){
          p.className = 'pill on';
          p.innerHTML = '<span class="dot g"></span>解析服务正常';
        } else {
          p.className = 'pill';
          p.innerHTML = '<span class="dot y"></span>解析服务可用（返回码 ' + (j && j.code) + '）';
        }
      })
      .catch(function(){
        clearTimeout(tm);
        var p = $('pApi');
        p.className = 'pill';
        p.innerHTML = '<span class="dot r"></span>解析服务连接失败，请检查网络';
      });
  }

  // 归一化不同平台返回结构
  function normalize(j){
    var d = (j && j.data) || {};
    var out = {
      title: d.title || d.desc || '未命名',
      author: '',
      cover: d.cover || '',
      duration: d.duration || 0,
      images: [],
      options: []   // [{label, url, size}]
    };

    if (d.author && d.author.name) out.author = d.author.name;
    else if (d.auther) out.author = d.auther;
    else if (d.user && d.user.name) out.author = d.user.name;

    if (Array.isArray(d.images) && d.images.length) out.images = d.images;

    // 主地址
    if (d.url) {
      out.options.push({
        label: d.label || d.quality || '默认',
        url: d.url,
        size: d.size || 0,
        sizeLabel: d.size_label || ''
      });
    }
    // 备份/多画质
    if (Array.isArray(d.video_backup)) {
      for (var i = 0; i < d.video_backup.length; i++){
        var b = d.video_backup[i];
        if (!b || !b.url) continue;
        out.options.push({
          label: (b.label || b.quality || ('线路' + (i + 1))) + (b.codec ? ' · ' + b.codec : ''),
          url: b.url,
          size: b.size || 0,
          sizeLabel: b.size_label || ''
        });
      }
    }
    // B站多分P
    if (Array.isArray(d.videos)) {
      for (var k = 0; k < d.videos.length; k++){
        var v = d.videos[k];
        if (!v || !v.url) continue;
        out.options.push({
          label: (v.title || ('P' + (v.index || k + 1))) + (v.accept && v.accept[0] ? ' · ' + v.accept[0] : ''),
          url: v.url,
          size: 0,
          sizeLabel: v.durationFormat || ''
        });
      }
    }
    // 去重
    var seen = {}, uniq = [];
    for (var q = 0; q < out.options.length; q++){
      if (!seen[out.options[q].url]) { seen[out.options[q].url] = 1; uniq.push(out.options[q]); }
    }
    out.options = uniq;
    return out;
  }

  function fmtSize(n){
    if (!n) return '';
    if (n > 1048576) return (n / 1048576).toFixed(1) + ' MB';
    if (n > 1024) return (n / 1024).toFixed(0) + ' KB';
    return n + ' B';
  }
  function fmtDur(s){
    if (!s) return '';
    s = Math.round(s);
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function safeName(s){
    return String(s).replace(/[\\\/:*?"<>|\r\n]+/g, '_').replace(/\s+/g, ' ').trim().slice(0, 70) || 'video';
  }

  function saveBlobUrl(url, name){
    return fetch(url, { mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer' })
      .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.blob(); })
      .then(function(blob){
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
        return blob.size;
      });
  }

  function download(url, name){
    var bar = $('bar'), fill = $('barFill');
    if (bar) { bar.style.display = 'block'; fill.style.width = '0%'; }
    logLine('开始下载：' + name, 'w');

    fetch(url, { mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer' })
      .then(function(res){
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var total = Number(res.headers.get('content-length') || 0);
        var type = res.headers.get('content-type') || '';
        var reader = res.body && res.body.getReader ? res.body.getReader() : null;

        if (!reader) return res.blob();

        var chunks = [], got = 0;
        return new Promise(function(resolve, reject){
          (function pump(){
            reader.read().then(function(r){
              if (r.done) {
                resolve(new Blob(chunks, { type: type || 'video/mp4' }));
                return;
              }
              chunks.push(r.value);
              got += r.value.length;
              if (total && fill) fill.style.width = Math.min(100, (got / total * 100)).toFixed(1) + '%';
              else if (fill && got > 0) fill.style.width = '60%';
              pump();
            }).catch(reject);
          })();
        });
      })
      .then(function(blob){
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 4000);
        var bar2 = $('bar');
        if (bar2) setTimeout(function(){ bar2.style.display = 'none'; }, 1200);
        logLine('下载完成：' + name + '（' + fmtSize(blob.size) + '）', 'ok');
        toast('已开始保存：' + name);
      })
      .catch(function(e){
        var bar3 = $('bar');
        if (bar3) bar3.style.display = 'none';
        logLine('浏览器直下失败（' + e.message + '），已改为新窗口打开，长按/右键即可保存。', 'e');
        window.open(url, '_blank', 'noreferrer');
        toast('请在新窗口长按视频保存');
      });
  }

  function render(item, idx){
    var box = document.createElement('div');
    box.className = 'card';

    var head = document.createElement('div');
    head.className = 'res';

    if (item.cover){
      var th = document.createElement('div');
      th.className = 'thumb';
      var im = document.createElement('img');
      im.src = item.cover;
      im.alt = '';
      im.referrerPolicy = 'no-referrer';
      im.onerror = function(){ th.style.display = 'none'; };
      th.appendChild(im);
      head.appendChild(th);
    }

    var meta = document.createElement('div');
    meta.className = 'meta';

    var h = document.createElement('h3');
    h.textContent = item.title;
    meta.appendChild(h);

    var line = [];
    if (item.author) line.push('作者：' + item.author);
    if (item.duration) line.push('时长：' + fmtDur(item.duration));
    if (item.images.length) line.push('图集：' + item.images.length + ' 张');
    if (line.length){
      var kv = document.createElement('div');
      kv.className = 'kv';
      kv.textContent = line.join('　·　');
      meta.appendChild(kv);
    }

    // 画质选择
    var sel = item.options.length ? item.options[0] : null;
    if (item.options.length > 1){
      var qs = document.createElement('div');
      qs.className = 'quals';
      item.options.forEach(function(o, i){
        var b = document.createElement('div');
        b.className = 'qual' + (i === 0 ? ' on' : '');
        var txt = o.label;
        var sz = o.sizeLabel || fmtSize(o.size);
        if (sz) txt += ' · ' + sz;
        b.textContent = txt;
        b.onclick = function(){
          var all = qs.querySelectorAll('.qual');
          for (var z = 0; z < all.length; z++) all[z].classList.remove('on');
          b.classList.add('on');
          sel = o;
        };
        qs.appendChild(b);
      });
      meta.appendChild(qs);
    } else if (sel){
      var one = document.createElement('div');
      one.className = 'kv';
      var sz1 = sel.sizeLabel || fmtSize(sel.size);
      one.textContent = '画质：' + sel.label + (sz1 ? '　·　' + sz1 : '');
      meta.appendChild(one);
    }

    var acts = document.createElement('div');
    acts.className = 'acts';

    if (sel){
      var btn = document.createElement('button');
      btn.textContent = '下载视频';
      btn.onclick = function(){
        var cur = sel;
        download(cur.url, safeName(item.title) + '.mp4');
      };
      acts.appendChild(btn);

      var cp = document.createElement('button');
      cp.className = 'ghost sm';
      cp.textContent = '复制直链';
      cp.onclick = function(){
        var u = sel.url;
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(u).then(function(){ toast('直链已复制'); })
            .catch(function(){ window.prompt('复制下面的直链：', u); });
        } else {
          window.prompt('复制下面的直链：', u);
        }
      };
      acts.appendChild(cp);
    }

    if (item.images.length){
      var dbtn = document.createElement('button');
      dbtn.className = 'ghost sm';
      dbtn.textContent = '下载全部图片（' + item.images.length + '）';
      dbtn.onclick = function(){
        item.images.forEach(function(u, i){
          setTimeout(function(){
            saveBlobUrl(u, safeName(item.title) + '_' + (i + 1) + '.jpg')
              .catch(function(){ window.open(u, '_blank'); });
          }, i * 420);
        });
        logLine('已提交 ' + item.images.length + ' 张图片下载任务。', 'w');
      };
      acts.appendChild(dbtn);
    }

    if (!sel && !item.images.length){
      var no = document.createElement('div');
      no.className = 'kv';
      no.textContent = '未从该链接解析出可下载的媒体地址。';
      meta.appendChild(no);
    }

    meta.appendChild(acts);
    head.appendChild(meta);
    box.appendChild(head);

    if (item.images.length){
      var g = document.createElement('div');
      g.className = 'grid';
      item.images.forEach(function(u, i){
        var f = document.createElement('figure');
        var im2 = document.createElement('img');
        im2.src = u;
        im2.loading = 'lazy';
        im2.referrerPolicy = 'no-referrer';
        var a2 = document.createElement('a');
        a2.href = u;
        a2.target = '_blank';
        a2.rel = 'noopener';
        a2.textContent = '查看/保存';
        f.appendChild(im2);
        f.appendChild(a2);
        g.appendChild(f);
      });
      box.appendChild(g);
    }

    $('out').appendChild(box);
  }

  var busy = false;

  function run(){
    if (busy) return;
    var raw = $('urls').value || '';
    var urls = extractUrls(raw);
    if (!urls.length){
      toast('没找到链接，请粘贴完整分享链接');
      logReset();
      logLine('未识别到任何 http(s) 链接。', 'e');
      return;
    }

    busy = true;
    $('go').disabled = true;
    $('out').innerHTML = '';
    logReset();
    logLine('共识别到 ' + urls.length + ' 条链接，开始解析…');

    var i = 0;
    function next(){
      if (i >= urls.length){
        busy = false;
        $('go').disabled = false;
        logLine('全部处理完毕。', 'ok');
        toast('解析完成');
        return;
      }
      var u = urls[i++];
      var p = pickPlatform(u);
      logLine('[' + i + '/' + urls.length + '] ' + p + ' ← ' + u);
      fetch(apiFor(p) + encodeURIComponent(u))
        .then(function(r){ return r.json(); })
        .then(function(j){
          if (j && j.code === 200){
            var item = normalize(j);
            if (item.options.length || item.images.length){
              render(item, i);
              logLine('  解析成功：' + item.title, 'ok');
            } else {
              logLine('  解析成功但未取得媒体地址。', 'w');
            }
          } else {
            logLine('  解析失败：' + ((j && j.msg) || '未知错误'), 'e');
            // 单平台失败时用聚合接口再试一次
            if (p !== 'juhev'){
              logLine('  换用聚合接口重试…', 'w');
              return fetch(apiFor('juhev') + encodeURIComponent(u))
                .then(function(r2){ return r2.json(); })
                .then(function(j2){
                  if (j2 && j2.code === 200){
                    var it2 = normalize(j2);
                    if (it2.options.length || it2.images.length){
                      render(it2, i);
                      logLine('  聚合解析成功：' + it2.title, 'ok');
                      return;
                    }
                  }
                  logLine('  聚合解析同样失败。', 'e');
                })
                .catch(function(){ logLine('  聚合解析请求异常。', 'e'); });
            }
          }
        })
        .catch(function(e){
          logLine('  请求异常：' + e.message, 'e');
        })
        .then(function(){
          setTimeout(next, 260);
        });
    }
    next();
  }

  $('go').onclick = run;
  $('clr').onclick = function(){
    $('urls').value = '';
    $('out').innerHTML = '';
    logReset();
    logLine('已清空。');
  };
  $('paste').onclick = function(){
    if (navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(function(t){
        if (t) { $('urls').value = t; toast('已粘贴剪贴板内容'); }
        else toast('剪贴板是空的');
      }).catch(function(){ toast('浏览器未授权读取剪贴板，请手动粘贴'); });
    } else {
      toast('当前浏览器不支持一键粘贴，请手动长按粘贴');
    }
  };

  $('urls').addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') run();
  });

  // 进度条容器
  var barHtml = document.createElement('div');
  barHtml.className = 'bar';
  barHtml.id = 'bar';
  barHtml.innerHTML = '<i id="barFill"></i>';
  $('log').parentNode.insertBefore(barHtml, $('log'));

  checkApi();
})();
</script>
</body>
</html>
